name: release

# A tag is what makes "v0.9.0" a referenceable object rather than a string in
# two files. It also gives KBS-001 K-09 something to compare against: the
# registry is kernel, and a drift check needs a ratified version, not whatever
# happens to be on disk today.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build a release for (v0.3.1 ... v0.9.0 predate this workflow)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Run the suite against the tagged commit
        run: python -m pytest -q

      # The self-check runs on the tag itself, not merely on the branch the tag
      # came from. A release built from a commit whose gate was never exercised
      # is a package asserting a property nobody verified.
      - name: The gate must deny with nothing attested
        run: |
          code=0
          neuraxis --attestations /tmp/absent.jsonl gate \
            --capability IL-06 --identity ci --role drafter \
            --intent "release self-check" --scope release --verifier github-ci || code=$?
          if [ "$code" != "10" ]; then
            echo "::error::gate exited $code with no attestations on file; expected 10 (DENY)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Record the ratified registry digest
        id: digest
        run: |
          file=src/neuraxis/config/neuraxis.yaml
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          neuraxis --json validate > dist/registry-validate.json
          {
            printf 'registry: %s\n' "$file"
            printf 'sha256:   %s\n' "$sha"
            printf 'version:  %s\n' "$(python -c 'import neuraxis; print(neuraxis.__version__)')"
            printf 'tag:      %s\n' "${{ inputs.tag || github.ref_name }}"
            printf 'commit:   %s\n' "$(git rev-parse HEAD)"
          } > dist/REGISTRY-DIGEST.txt
          cat dist/REGISTRY-DIGEST.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          {
            printf 'Ratified registry `src/neuraxis/config/neuraxis.yaml`\n\n'
            printf '    sha256 %s\n\n' "${{ steps.digest.outputs.sha }}"
            printf 'This is the version a K-09 drift check compares against. `REGISTRY-DIGEST.txt`\n'
            printf 'and `registry-validate.json` ship as assets so the comparison does not depend\n'
            printf 'on recomputing it from whatever is on disk later.\n\n'
            printf 'The suite and the gate self-check ran against this commit: with no attestations\n'
            printf 'on file the gate denies, which is the property CI asserts on every push.\n'
          } > NOTES.md
          gh release create "$tag" --title "$tag" --notes-file NOTES.md dist/*
