[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraxis"
version = "0.22.0"
description = "BST Neuraxis â€” Intelligent Loop Registry and Governance Gate (ILR-001)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary â€” BizEra / BST" }
authors = [{ name = "BizEra (BST)" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
neuraxis = "neuraxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuraxis = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
# scripts/ is here because rollback_drill.py produces GV-05's evidence and
# ratification_gap.py decides whether the drift baseline is stale. Both were
# outside the floor, and rollback_drill.py had sat at 61% - its whole main()
# untested - while the package reported 93% and fail_under kept passing. A
# floor that excludes the code most worth flooring is a number, not a control.
source = ["neuraxis", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
