[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraxis"
version = "0.3.1"
description = "BST Neuraxis — Intelligent Loop Registry and Governance Gate (ILR-001)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — BizEra / BST" }
authors = [{ name = "BizEra (BST)" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
neuraxis = "neuraxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuraxis = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["neuraxis"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
